  haneoka_render_profile_flutter:
    git:
      url: https://github.com/haneoka-gakuen/haneoka-render-profile.git
      ref: 6baf2d21b3a8e213e8ec1b57980f0184a39ad91d
      path: flutter
  image: ^4.12.0
  jni: ^1.1.0
  ffi: ^2.2.0
  app_links: ^7.2.2
  archive: ^4.5.0
  audioplayers: ^6.8.1
  cached_network_image: ^4.0.4
  cronet_http: ^1.10.0
  crypto: ^3.0.7
  cupertino_http:
    git:
      url: https://github.com/dart-lang/http.git
      ref: 6e91ce3e73ab079114de3684367318287b08d893
      path: pkgs/cupertino_http
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_widget_from_html_core: ^0.17.4
  http: ^1.6.0
  html: ^0.15.7
  intl: any
  material_new_shapes: ^1.0.0
  material_symbols_icons: ^4.2960.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_view: ^0.15.0
  pointycastle: ^4.0.0
  shared_preferences: ^2.5.6
  sqlite3: ^3.7.0
  two_dimensional_scrollables: ^0.5.5
  url_launcher: ^6.3.3
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  flutter_soloud:
    git:
      url: https://github.com/haneoka-gakuen/flutter_soloud.git
      ref: 421afc8897576929b3b4812d9e29c31f0a900adc
  window_manager: ^0.5.2
  spine_flutter: 4.2.36
dependency_overrides:
  media_kit_libs_windows_video:
    path: third_party/media_kit_libs_windows_video

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true
  assets:
    - LICENSE
    - third_party/chart_editor/
    - assets/i18n/
    - assets/brand/
    - assets/brand/oauth/
    - assets/settings/
    - assets/fonts/OFL.txt
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    # One variable font per writing system, with the complete upstream glyph set.
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC-Variable.ttf
    - family: Noto Sans TC
      fonts:
        - asset: assets/fonts/NotoSansTC-Variable.ttf
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP-Variable.ttf
    - family: Noto Sans KR
      fonts:
        - asset: assets/fonts/NotoSansKR-Variable.ttf
    # The stamp maker's pinned faces (`stamp-maker-font-sources.json`),
    # converted from the website's WOFF2 mirrors.
    - family: YurukaStd
      fonts:
        - asset: assets/stamp-fonts/YurukaStd.ttf
          weight: 900
    - family: SSFangTangTi
      fonts:
        - asset: assets/stamp-fonts/SSFangTangTi.ttf

hooks:
  user_defines:
    flutter_soloud:
      prebuild_tag: v1.0.2
