name: haneoka
description: "Haneoka for BanG Dream! Our Notes, with your game accounts on every platform."
publish_to: 'none'
version: 0.2.3+65

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  game_data_exporter:
    git:
      url: https://github.com/haneoka-gakuen/game-data-exporter.git
      ref: fbc0f99dd60e511e10dd0d92063c8f96d8237e2f
      path: dart
  webview_all: ^1.4.5
  webview_all_android: ^1.4.5
  app_links: ^7.2.2
  archive: ^4.5.0
  cached_network_image: ^4.0.4
  cronet_http: ^1.10.0
  crypto: ^3.0.7
  cupertino_http:
    git:
      url: https://github.com/dart-lang/http.git
      ref: 6e91ce3e73ab079114de3684367318287b08d893
      path: pkgs/cupertino_http
  file_picker: ^13.1.0
  flutter_cache_manager: ^3.4.5
  flutter_svg: ^2.3.0
  http: ^1.6.0
  intl: any
  jni: ^1.1.0
  material_new_shapes: ^1.0.0
  material_symbols_icons: ^4.2960.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_view: ^0.15.0
  pointycastle: ^4.0.0
  shared_preferences: ^2.5.6
  sqlite3: ^3.7.0
  timezone: ^0.10.1
  unorm_dart: ^0.3.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true
  assets:
    - LICENSE
    - assets/brand/
    - assets/i18n/
    - assets/settings/
