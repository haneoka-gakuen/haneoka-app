      url: https://github.com/haneoka-gakuen/vega.git
      ref: dbd403ca49fbeb00d3778485f75b447e3aa8cbad
      path: packages/runtime-ffi/dart
  vega_plugin_cubism:
    git:
      url: https://github.com/haneoka-gakuen/vega-plugin-cubism.git
