[package]
name = "haneoka"
description = "Haneoka"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "haneoka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
haneoka-core = { path = "../core" }
tauri-plugin-haneoka-device = { path = "../plugins/device" }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-deep-link = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-updater = "2.14"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
