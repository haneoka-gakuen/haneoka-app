[package]
name = "haneoka"
description = "Haneoka"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "haneoka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
haneoka-core = { path = "../core" }
tauri-plugin-haneoka-device = { path = "../plugins/device" }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-deep-link = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "fs"] }
base64 = "0.22"
sha2 = "0.10"
minisign-verify = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
percent-encoding = "2"
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rand = "0.8"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
log = "0.4.35"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-updater = "2.14"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
