<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <title>haneoka</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="bar"></div>
    <main class="page" id="page"></main>
    <script type="module">
      import { call, setup, t, icon, escape, bar, date, emblem, openSite, sunny } from "./app.js";

      await setup();
      document.title = t("accountTitle");
      document.getElementById("bar").innerHTML = bar({
        title: t("accountTitle"),
        back: "#back",
        actions: `<a class="icon-button" href="index.html?choose" aria-label="${escape(t("chooseSite"))}">${icon("public")}</a>
          <a class="icon-button" href="import.html" aria-label="${escape(t("importMore"))}">${icon("add")}</a>`,
      });
      document.querySelector('[href="#back"]').addEventListener("click", (event) => {
        event.preventDefault();
        if (history.length > 1) history.back();
        else openSite("/intl/{locale}/");
      });

      const render = async () => {
        const saves = await call("gameAccounts").catch(() => []);
        const page = document.getElementById("page");
        const heading = `<h2 class="methods-title">${escape(t("importedAccounts"))}</h2>`;
        if (!saves.length) {
          page.innerHTML = `${heading}<section class="empty">
            <span class="method__icon method__icon--empty">${icon("sd_card")}</span>
            <h3>${escape(t("noAccountsYet"))}</h3>
            <p class="muted">${escape(t("importIntro"))}</p>
            <a class="button button--filled" href="import.html">${icon("add")}${escape(t("importMore"))}</a>
          </section>`;
          return;
        }
        page.innerHTML = `${heading}${saves
          .map(
            (save) => `<a class="account-card" href="save.html?key=${encodeURIComponent(save.key)}">
              <span class="account-card__rank">${sunny}<strong>${escape(save.rank ?? "—")}</strong></span>
              <span class="grow">
                <span class="account-card__name"><span>${escape(save.name || save.profileId)}</span><img src="${emblem(save.release, save.server)}" alt="" width="18" height="18" /></span>
                <span class="account-card__meta">${escape([save.region, `ID ${save.profileId}`].filter(Boolean).join(" / "))}</span>
                ${save.savedAt == null ? "" : `<span class="account-card__meta">${escape(t("savedOn", { time: date(save.savedAt, true) }))}</span>`}
              </span>
              ${icon("chevron_right")}
            </a>`,
          )
          .join("")}`;
      };
      await render();
    </script>
  </body>
</html>
