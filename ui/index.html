<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <title>haneoka</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main class="start">
      <img class="start__logo" src="logo.svg" alt="" />
      <div class="start__panel" id="loading">
        <div class="progress"></div>
      </div>
      <div class="start__panel" id="choose" hidden>
        <h1 class="section-title" id="choose-title"></h1>
        <p class="muted" id="failed" hidden></p>
        <ul class="list" id="sites"></ul>
        <ul class="list">
          <li>
            <a class="row" href="saves.html" id="saves-link">
              <span class="row__lead" id="saves-icon"></span>
              <span class="row__text"><span class="row__title" id="saves-label"></span></span>
              <span class="row__trail" id="saves-trail"></span>
            </a>
          </li>
        </ul>
      </div>
    </main>
    <script type="module">
      import { call, info, setup, t, icon, escape } from "./app.js";

      const query = new URLSearchParams(location.search);
      const failed = query.get("failed");
      const path = query.get("path");
      const latency = new Map();

      const probe = async (origin, attempts = 3) => {
        const times = [];
        for (let attempt = 0; attempt < attempts; attempt++) {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 8000);
          const start = performance.now();
          try {
            const response = await fetch(`${origin}/site.webmanifest?probe=${Date.now()}`, { cache: "no-store", signal: controller.signal });
            if (!response.ok) break;
            await response.arrayBuffer();
            times.push(performance.now() - start);
          } catch {
            break;
          } finally {
            clearTimeout(timer);
          }
        }
        return times.length ? Math.round(times.sort((a, b) => a - b)[Math.floor(times.length / 2)]) : null;
      };

      const go = async (origin) => {
        await call("chooseOrigin", { origin });
        const target = await window.__TAURI_INTERNALS__.invoke("launch_info", { locale: document.documentElement.lang, path });
        location.replace(origin + target.path);
      };

      const render = () => {
        const fastest = [...latency.entries()].filter(([, ms]) => ms != null).sort((a, b) => a[1] - b[1])[0]?.[0];
        document.getElementById("sites").innerHTML = info.origins
          .map((origin) => {
            const ms = latency.get(origin);
            const trail = !latency.has(origin) ? escape(t("testing")) : ms == null ? escape(t("unreachable")) : `<strong>${ms}</strong> ms`;
            return `<li><button class="row site-choice" type="button" data-origin="${escape(origin)}" aria-pressed="${origin === info.chosen}" ${latency.has(origin) && ms == null ? "disabled" : ""}>
              <span class="row__lead">${icon("public")}</span>
              <span class="row__text"><span class="row__title">${escape(new URL(origin).host)}</span>${origin === fastest ? `<span class="row__supporting"><span class="badge">${escape(t("recommended"))}</span></span>` : ""}</span>
              <span class="row__trail">${trail}</span>
            </button></li>`;
          })
          .join("");
      };

      const choose = () => {
        document.getElementById("loading").hidden = true;
        document.getElementById("choose").hidden = false;
        document.getElementById("choose-title").textContent = t("chooseSite");
        document.getElementById("saves-icon").innerHTML = icon("sports_esports");
        document.getElementById("saves-label").textContent = t("importedAccounts");
        document.getElementById("saves-trail").innerHTML = icon("chevron_right");
        if (failed) {
          const message = document.getElementById("failed");
          message.textContent = t("siteFailed", { host: new URL(failed).host });
          message.hidden = false;
        }
        render();
        for (const origin of info.origins) probe(origin).then((ms) => (latency.set(origin, ms), render()));
      };

      document.getElementById("sites").addEventListener("click", (event) => {
        const button = event.target.closest("[data-origin]");
        if (button && !button.disabled) go(button.dataset.origin);
      });

      await setup();
      const page = await call("pendingPage").catch(() => null);
      if (page) location.replace(page);
      else if (failed || query.has("choose") || !info.chosen) choose();
      else if ((await probe(info.chosen, 1)) != null) go(info.chosen);
      else {
        const message = document.getElementById("failed");
        message.textContent = t("siteFailed", { host: new URL(info.chosen).host });
        message.hidden = false;
        choose();
      }
    </script>
  </body>
</html>
