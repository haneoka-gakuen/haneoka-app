<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <title>haneoka</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="bar"></div>
    <main class="page" id="page"><div class="progress"></div></main>
    <dialog id="dialog"></dialog>
    <script type="module">
      import { call, setup, t, icon, escape, bar, number, date, snackbar, failure, emblem, site, openSite, locale, sunny } from "./app.js";

      await setup();
      const key = new URLSearchParams(location.search).get("key");
      let detail = await call("saveDetail", { key }).catch(() => null);
      if (!detail) {
        location.replace("saves.html");
        throw new Error("save_not_found");
      }
      let catalog = null;
      let newest = false;
      let expanded = new Set();
      const folds = new Set();
      let link = null;
      let busy = false;

      // ---------- catalogue text and data ----------
      const TEXT = ["ja", "en", "zh-TW", "zh-CN", "ko"];
      const FALLBACK = {
        "zh-CN": ["zh-CN", "zh-TW", "ja", "en", "ko"],
        "zh-TW": ["zh-TW", "ja", "en", "zh-CN", "ko"],
        ja: ["ja", "en", "zh-TW", "zh-CN", "ko"],
        ko: ["ko", "ja", "en", "zh-TW", "zh-CN"],
        en: ["en", "ja", "zh-TW", "zh-CN", "ko"],
      };
      const text = (value) => {
        if (typeof value === "string") return value;
        if (!Array.isArray(value)) return "";
        for (const code of FALLBACK[locale]) {
          const entry = value[TEXT.indexOf(code)];
          if (typeof entry === "string" && entry.trim()) return entry;
        }
        return "";
      };
      const int = (value) => (value == null || value === "" ? null : Number(value));
      const player = () => detail.player ?? {};
      const rows = (field) => {
        const value = player()[field];
        if (Array.isArray(value)) return value.filter((row) => row && typeof row === "object");
        if (value && typeof value === "object") return Object.values(value).find(Array.isArray) ?? [value];
        return [];
      };

      async function loadCatalog() {
        const server = detail.account.server ?? "intl";
        const base = `${site()}/api/v1/servers/${server}/`;
        // Offline, the last release read still has its documents in the HTTP cache.
        const remembered = `haneoka:catalog-release:${server}`;
        const identity = await fetch(`${base}release?projection=identity`)
          .then((r) => r.json())
          .then((value) => {
            try {
              localStorage.setItem(remembered, value.releaseId);
            } catch {}
            return value;
          })
          .catch(() => {
            const releaseId = (() => {
              try {
                return localStorage.getItem(remembered);
              } catch {
                return null;
              }
            })();
            if (!releaseId) throw new Error("offline");
            return { releaseId };
          });
        // Release-pinned documents are immutable: the browser keeps them after the first read.
        const pinned = (resource, query = "") =>
          fetch(`${base}${resource}?${query}release=${encodeURIComponent(identity.releaseId)}`)
            .then((r) => (r.ok ? r.json() : {}))
            .catch(() => ({}));
        const [cards, supports, items, events, progression, songs, marks, characters] = await Promise.all([
          pinned("cards"),
          pinned("support-cards"),
          pinned("items"),
          pinned("events"),
          pinned("progression"),
          pinned("songs", "projection=4&"),
          pinned("ui-marks"),
          pinned("characters"),
        ]);
        return {
          release: identity.releaseId,
          asset: (path) => (typeof path === "string" && path.startsWith("/") ? `${site()}${path}?release=${encodeURIComponent(identity.releaseId)}` : null),
          cards,
          supports,
          items: items.items ?? {},
          events: Array.isArray(events) ? Object.fromEntries(events.map((e) => [String(e.id), e])) : (events.entries ?? events),
          progression,
          songs: songs ?? {},
          characters: characters.entries ?? characters ?? {},
          // Sprite name to its runtime asset (`fetchCatalogVisuals`).
          mark: (name) => {
            const path = (marks.entries ?? marks)?.[name];
            return typeof path === "string" ? `${site()}/runtime/${server}/${path.replace(/^runtime\//, "")}` : null;
          },
        };
      }

      /** A card's level from its experience and training, capped as the game caps it. */
      function level(row, member) {
        const p = catalog?.progression;
        const card = (member ? catalog?.cards : catalog?.supports)?.[String(row._masterId)];
        if (!p || !card) return null;
        const group = card[member ? "memberCardLevelGroup" : "supportCardLevelGroup"];
        const table = p[member ? "memberCardLevels" : "supportCardLevels"];
        if (group == null || !Array.isArray(table)) return null;
        const exp = BigInt(String(row._exp ?? 0).split(".")[0] || "0");
        let result = null;
        for (const entry of table) if (String(entry.group) === String(group) && BigInt(entry.exp ?? 0) <= exp) result = Math.max(result ?? 0, Number(entry.level));
        const limits = p[member ? "memberCardLevelLimits" : "supportCardRanks"];
        for (const value of Array.isArray(limits) ? limits : []) {
          const raw = value.raw ?? {};
          const matches = member
            ? String(raw._rarity) === String(card.rarity) && String(raw._awakeCount) === String(row._awakeCount)
            : String(raw._group) === String(card.supportCardRankGroup) && String(raw._rank) === String(row._rank);
          if (matches && result != null && Number(raw._limitLevel) > 0) return Math.min(result, Number(raw._limitLevel));
        }
        return result;
      }

      // ---------- sections ----------
      const RARITY = { 2: "R", 3: "SR", 4: "SSR", 10: "EX", 20: "BD" };
      const COLOURS = ["", "Red", "Blue", "Green", "Yellow", "Purple"];
      const outlined = (value, cls) => `<span class="art__number ${cls}">${escape(value)}</span>`;
      const sprite = (url, cls, label = "") => (url ? `<img class="${cls}" src="${escape(url)}" alt="${escape(label)}" loading="lazy" />` : "");

      /** The card artwork with its marks, as the catalogue draws it (`CardArtwork`). */
      const artwork = (row, entry, member) => {
        const image = catalog?.asset(entry?.images?.thumbnail);
        const lv = level(row, member);
        const rank = int(row._rank) ?? 0;
        const skills = member
          ? [["live", int(row._liveSkillLevel)], ["gekisou", int(row._performanceSkillLevel)]]
              .map(([family, value]) => [catalog?.asset(entry?.resolvedSkills?.[family]?.icon), value])
              .filter(([url]) => url)
          : [];
        return `<span class="art ${member ? "art--member" : "art--support"}">
          ${image ? `<img class="art__image" src="${escape(image)}" alt="" loading="lazy" />` : ""}
          ${sprite(catalog?.mark(`CardType-${COLOURS[int(entry?.cardType) ?? 0] ?? ""}.png`), "art__attribute")}
          ${sprite(catalog?.mark(`RarityIconCenter_${RARITY[int(entry?.rarity)] ?? ""}.png`), "art__rarity")}
          ${skills.length ? `<span class="art__skills">${skills.map(([url, value]) => `<span>${sprite(url, "art__skill")}${outlined(value ?? "?", "art__number--skill")}</span>`).join("")}</span>` : ""}
          ${member ? `<span class="art__training">${sprite(catalog?.mark("SpecialTraining.png"), "art__training-icon")}${outlined(int(row._awakeCount) ?? "?", "art__number--training")}</span>` : ""}
          ${outlined(`Lv.${lv ?? "?"}`, "art__level")}
          ${sprite(catalog?.mark(member ? `CardRank${rank}.png` : `snaplimit_${rank}.png`), "art__rank")}
        </span>`;
      };

      const card = (row, member) => {
        const id = String(row._masterId);
        const entry = (member ? catalog?.cards : catalog?.supports)?.[id];
        const name = text(entry?.prefix) || text(entry?.cardName) || `#${id}`;
        const people = (entry?.characterIds ?? [entry?.characterId]).filter((c) => c != null).map((c) => catalog?.characters?.[String(c)]).filter(Boolean);
        const href = `${site()}/${detail.account.server ?? "intl"}/${locale}/${member ? "member-cards" : "support-cards"}/${id}/`;
        return `<a class="tile ${member ? "" : "tile--wide"}" href="${escape(href)}">
          ${artwork(row, entry, member)}
          <span class="tile__title">${escape(name)}</span>
          <span class="tile__subtitle">${people
            .slice(0, 3)
            .map((c) => sprite(catalog?.asset(c.faceImage ?? c.thumbnailImage), "tile__face"))
            .join("")}<span>${escape(people.map((c) => text(c.characterName)).join(" / "))}</span></span>
        </a>`;
      };

      const sorted = (list, member) => {
        const source = member ? catalog?.cards : catalog?.supports;
        const rarity = (row) => Number(source?.[String(row._masterId)]?.rarity ?? 0);
        const released = (row) => Number([].concat(source?.[String(row._masterId)]?.releasedAt ?? 0)[0] ?? 0) || Number(row._masterId);
        return [...list].sort((a, b) => (newest ? released(b) - released(a) : rarity(b) - rarity(a) || Number(b._masterId) - Number(a._masterId)));
      };

      const cardSection = (field, member, title, glyph) => {
        const list = sorted(rows(field), member);
        if (!list.length) return "";
        const open = expanded.has(field);
        return `<section class="save-section">
          <h2 class="section-title"><span class="section-badge">${icon(glyph)}</span><span class="grow">${escape(title)} / ${number(list.length)}</span>
          <button class="button button--text" type="button" data-expand="${field}">${escape(open ? t("cancel") : t("viewAll"))}</button></h2>
          <div class="rail ${member ? "" : "rail--wide"} ${open ? "rail--wrap" : ""}">${(open ? list : list.slice(0, 30)).map((row) => card(row, member)).join("")}</div>
        </section>`;
      };

      const clears = () => {
        const results = rows("_liveMusicResults");
        if (!results.length) return "";
        const songs = Object.values(catalog?.songs ?? {});
        return `<section class="save-section">
          <h2 class="section-title"><span class="section-badge">${icon("music_note")}</span><span class="grow">${escape(t("songClears"))}</span></h2>
          <div class="clears">${["EASY", "NORMAL", "HARD", "EXPERT"]
            .map((name, index) => {
              const key = name.toLowerCase();
              const total = songs.filter((song) => (song?.difficulty ?? []).some((d) => d?.difficulty === index)).length;
              const count = (threshold) => results.filter((row) => (int(row[`_${key}ClearedStatus`]) ?? 0) >= threshold).length;
              const values = [count(10), count(20), count(30)];
              const of = total || results.length;
              const labels = [t("cleared"), t("fullCombo"), t("allPerfect")];
              return `<div class="clear clear--${key}">
                <div class="clear__head">
                  <span class="clear__difficulty">${name}</span>
                  ${values.map((value, i) => `<span class="clear__count"><span class="clear__label"><i class="clear__dot clear__dot--${i}"></i>${escape(labels[i])}</span><strong>${number(value)}</strong></span>`).join("")}
                </div>
                <div class="clear__bar">${values.map((value, i) => `<i class="clear__fill clear__fill--${i}" style="width:${of ? Math.min(100, (value / of) * 100) : 0}%"></i>`).join("")}</div>
                <span class="clear__of">${escape(t("ofSongs", { total: number(of) }))}</span>
              </div>`;
            })
            .join("")}</div>
        </section>`;
      };

      const currencies = () => {
        const owned = Object.fromEntries(rows("_items").map((row) => [String(row._masterItemId), int(row._amount)]));
        const list = ["1", "2", "3"].filter((id) => catalog?.items?.[id]);
        if (!list.length) return "";
        return `<section class="save-section">
          <h2 class="section-title"><span class="section-badge">${icon("inventory_2")}</span><span class="grow">${escape(t("currencies"))}</span></h2>
          <div class="items">${list
            .map((id) => {
              const item = catalog.items[id];
              const image = catalog.asset(item.image);
              return `<div class="item">${image ? `<img src="${escape(image)}" alt="" width="36" height="36" />` : `<span class="item__blank"></span>`}<span class="grow">${escape(text(item.name))}</span><strong>${number(owned[id] ?? 0)}</strong></div>`;
            })
            .join("")}</div>
        </section>`;
      };

      const events = () => {
        const played = rows("_events").filter((row) => (int(row._eventPointCount) ?? 0) > 0);
        if (!played.length) return "";
        return `<section class="save-section">
          <h2 class="section-title"><span class="section-badge">${icon("event")}</span><span class="grow">${escape(t("eventsPlayed"))}</span></h2>
          <ul class="events">${played
            .map((row) => {
              const event = catalog?.events?.[String(row._masterId)];
              const image = catalog?.asset(event?.image);
              return `<li><a class="event" href="${escape(`${site()}/${detail.account.server ?? "intl"}/${locale}/events/${row._masterId}/`)}">
                ${image ? `<img src="${escape(image)}" alt="" loading="lazy" />` : `<span class="event__blank"></span>`}
                <span class="grow">${escape(text(event?.title) || `#${row._masterId}`)}</span>
                <strong>${escape(t("eventPoints", { points: number(int(row._eventPointCount)) }))}</strong></a></li>`;
            })
            .join("")}</ul>
        </section>`;
      };

      /** The public numbers a linked player shows; never the save itself. */
      const summary = () => {
        const p = player();
        const results = rows("_liveMusicResults");
        const count = (difficulty, threshold) => results.filter((row) => (int(row[`_${difficulty}ClearedStatus`]) ?? 0) >= threshold).length;
        const started = int(p._tutorialFinishedAtUnixSeconds);
        return {
          rank: detail.account.rank ?? null,
          exp: int(p._exp),
          rating: rows("_topHighScoreRatings").reduce((sum, row) => sum + (int(row._highScoreRating) ?? 0), 0),
          members: rows("_memberCards").length,
          snapshots: rows("_supportCards").length,
          favoriteMemberCardId: int(p._favoriteMemberCardId ?? p._lastLiveDeckLeaderMemberCardId),
          startedAt: started && started > 0 ? started : null,
          clears: Object.fromEntries(["easy", "normal", "hard", "expert"].map((d) => [d, [count(d, 10), count(d, 20), count(d, 30)]])),
        };
      };

      const linkPanel = () => {
        const explain = `<p class="muted link__explain">${escape(t("linkExplain"))}</p>`;
        if (!link) return `<div class="link">${explain}</div>`;
        if (!link.signedIn)
          return `<div class="link"><p>${escape(t("linkSignInFirst"))}</p>
            <button class="button button--filled" type="button" data-action="sign-in">${icon("login")}${escape(t("signIn"))}</button>${explain}</div>`;
        const linked = link.link;
        if (!linked)
          return `<div class="link"><button class="button button--filled" type="button" data-action="link" ${busy ? "disabled" : ""}>${icon("link")}${escape(t("linkToProfile"))}</button>${explain}</div>`;
        const synced = int(linked.lastSyncedAt);
        const visible = linked.visibility === "public";
        return `<div class="link">
          <div class="link__state">${icon("link")}<strong>${escape(t("linked"))}</strong>${synced ? `<span class="muted">${escape(t("syncedOn", { time: date(synced, true) }))}</span>` : ""}</div>
          <label class="switch-row"><span class="grow">${escape(t("showOnProfile"))}</span><input type="checkbox" role="switch" data-action="visibility" ${visible ? "checked" : ""} ${busy ? "disabled" : ""} /></label>
          <div class="cluster">
            <button class="button button--tonal" type="button" data-action="link" ${busy ? "disabled" : ""}>${icon("refresh")}${escape(t("syncNow"))}</button>
            <button class="button button--text" type="button" data-action="unlink" ${busy ? "disabled" : ""}>${icon("link_off")}${escape(t("unlink"))}</button>
          </div>${explain}</div>`;
      };
      const linkFailure = (error) => snackbar(String(error?.message ?? error).includes("player_linked") ? t("linkedElsewhere") : t("linkFailed"));
      const loadLink = () =>
        call("playerLink", { key })
          .then((value) => {
            link = value;
            render();
          })
          .catch(() => {});

      const render = () => {
        const a = detail.account;
        const p = player();
        const favorite = catalog?.cards?.[String(p._favoriteMemberCardId ?? p._lastLiveDeckLeaderMemberCardId ?? "")];
        const art = catalog?.asset(favorite?.images?.full ?? favorite?.images?.thumbnail);
        const started = int(p._tutorialFinishedAtUnixSeconds);
        const rating = rows("_topHighScoreRatings").reduce((sum, row) => sum + (int(row._highScoreRating) ?? 0), 0);
        const vip = int(p._vip?._rank);
        document.getElementById("bar").innerHTML = bar({
          title: a.name || a.profileId,
          back: "saves.html",
          actions: `<button class="icon-button icon-button--tonal" type="button" data-action="team" aria-label="${escape(t("importToTeamBuilder"))}" ${busy ? "disabled" : ""}>${icon("groups")}</button>
            ${a.canRefresh ? `<button class="icon-button" type="button" data-action="sync" aria-label="${escape(t("syncFromGame"))}" ${busy ? "disabled" : ""}>${icon("cloud_sync")}</button>` : ""}
            <a class="icon-button" href="import.html?update=${encodeURIComponent(key)}" aria-label="${escape(t("updateSave"))}">${icon("refresh")}</a>`,
        });
        document.title = a.name || a.profileId;
        document.getElementById("page").innerHTML = `
          <section class="surface profile">
            ${art ? `<img class="profile__art" src="${escape(art)}" alt="" decoding="async" />` : ""}
            <div class="rank">${sunny}<div><span>RANK</span><strong>${escape(a.rank ?? "—")}</strong></div></div>
            <div class="profile__meta">
              <h2>${escape(a.name || a.profileId)}</h2>
              <span class="profile__region"><img src="${emblem(detail.release, a.server)}" alt="" />${escape(a.region ?? "")}</span>
              <button class="copy" type="button" data-action="copy-id">${escape(`${t("playerId")} ${a.profileId}`)}${icon("content_copy", "icon--small")}</button>
              ${started ? `<span class="muted">${escape(`${t("tutorialDone")} / ${date(started * 1000)}`)}</span>` : ""}
              ${a.savedAt ? `<span class="muted">${escape(t("savedOn", { time: date(a.savedAt, true) }))}</span>` : ""}
            </div>
          </section>
          <div class="cluster">
            ${a.canRefresh ? `<button class="button button--tonal" type="button" data-action="history" ${busy ? "disabled" : ""}>${icon("history")}${escape(t("readHistory"))}</button>` : ""}
            <button class="button button--filled" type="button" data-action="team" ${busy ? "disabled" : ""}>${icon("groups")}${escape(t("importToTeamBuilder"))}</button>
            <button class="button button--tonal" type="button" data-action="songs" ${busy ? "disabled" : ""}>${icon("checklist")}${escape(t("songProgress"))}</button>
            ${a.canRefresh ? `<button class="button button--tonal" type="button" data-action="sync" ${busy ? "disabled" : ""}>${icon("cloud_sync")}${escape(t("syncFromGame"))}</button>` : ""}
            <a class="button button--outlined" href="import.html?update=${encodeURIComponent(key)}">${icon("refresh")}${escape(t("updateSave"))}</a>
          </div>
          <p class="muted hint">${escape(t("importToTeamHint"))}</p>
          <div class="stats">
            <div class="stat">${icon("trending_up")}<div><span>${escape(t("playerExp"))}</span><strong>${number(int(p._exp))}</strong></div></div>
            <div class="stat">${icon("military_tech")}<div><span>${escape(t("highScoreRating"))}</span><strong>${number(rating)}</strong></div></div>
            ${vip != null ? `<div class="stat">${icon("credit_card")}<div><span>${escape(t("vipRank"))}</span><strong>RANK ${number(vip)}</strong></div></div>` : ""}
            <div class="stat">${icon("person")}<div><span>${escape(t("ownedMembers"))}</span><strong>${number(rows("_memberCards").length)}</strong></div></div>
            <div class="stat">${icon("photo_library")}<div><span>${escape(t("ownedSnapshots"))}</span><strong>${number(rows("_supportCards").length)}</strong></div></div>
          </div>
          <div class="cluster" role="group" aria-label="${escape(t("cardSort"))}">
            <span class="muted">${escape(t("cardSort"))}</span>
            <button class="chip" type="button" data-sort="rarity" aria-pressed="${!newest}">${!newest ? icon("check", "icon--small") : ""}${escape(t("sortRarity"))}</button>
            <button class="chip" type="button" data-sort="newest" aria-pressed="${newest}">${newest ? icon("check", "icon--small") : ""}${escape(t("sortNewest"))}</button>
          </div>
          ${cardSection("_memberCards", true, t("ownedMembers"), "person")}
          ${cardSection("_supportCards", false, t("ownedSnapshots"), "photo_library")}
          ${clears()}
          ${currencies()}
          ${events()}
          <section class="save-section">
            <h2 class="section-title"><span class="section-badge">${icon("public")}</span><span class="grow">${escape(t("profileLink"))}</span></h2>
            ${linkPanel()}
          </section>
          <details class="fold" data-fold="exports" ${folds.has("exports") ? "open" : ""}>
            <summary>${escape(t("exportsTitle"))}${icon("expand_more")}</summary>
            <div class="fold__body">
              <div class="exports">
                <button class="export" type="button" data-action="copy-package">${icon("content_copy")}<span class="grow"><strong>${escape(t("exportTeam"))}</strong><span>${escape(t("exportTeamHint"))}</span></span>${icon("chevron_right")}</button>
                <button class="export" type="button" data-action="export">${icon("download")}<span class="grow"><strong>${escape(t("exportSave"))}</strong><span>${escape(t("exportSaveHint"))}</span></span>${icon("chevron_right")}</button>
              </div>
              <button class="button button--text button--danger" type="button" data-action="remove" style="justify-self:start">${icon("delete")}${escape(t("removeAccount"))}</button>
            </div>
          </details>
          <details class="fold" data-fold="raw" ${folds.has("raw") ? "open" : ""}>
            <summary>${escape(t("rawData"))}${icon("expand_more")}</summary>
            <div class="fold__body">
              <ul class="list">
                <li><button class="row" type="button" data-json="settings"><span class="row__text"><span class="row__title">${escape(t("settings"))}</span></span><span class="row__trail">${icon("chevron_right")}</span></button></li>
                ${detail.persist ? `<li><button class="row" type="button" data-json="persist"><span class="row__text"><span class="row__title">${escape(t("latestLive"))}</span></span><span class="row__trail">${icon("chevron_right")}</span></button></li>` : ""}
              </ul>
            </div>
          </details>`;
      };

      // ---------- actions ----------
      const run = async (work) => {
        if (busy) return;
        busy = true;
        render();
        try {
          await work();
        } catch (error) {
          snackbar(failure(error));
        } finally {
          busy = false;
          render();
        }
      };
      const dialog = document.getElementById("dialog");

      document.addEventListener("click", (event) => {
        const target = event.target.closest("button");
        if (!target || target.disabled) return;
        if (target.dataset.sort) {
          newest = target.dataset.sort === "newest";
          return render();
        }
        if (target.dataset.expand) {
          const field = target.dataset.expand;
          expanded.has(field) ? expanded.delete(field) : expanded.add(field);
          return render();
        }
        if (target.dataset.json) {
          const value = target.dataset.json === "settings" ? detail.settings : detail.persist;
          dialog.innerHTML = `<h2>${escape(target.dataset.json === "settings" ? t("settings") : t("latestLive"))}</h2><pre class="json">${escape(JSON.stringify(value, null, 2))}</pre>
            <div class="dialog__actions"><button class="button button--text" type="button" data-close>${escape(t("back"))}</button></div>`;
          return dialog.showModal();
        }
        if ("close" in target.dataset) return dialog.close();
        switch (target.dataset.action) {
          case "sign-in":
            return openSite("/{locale}/account/");
          case "link":
            return run(async () => {
              try {
                link = await call("linkPlayer", { key, public: link?.link ? link.link.visibility === "public" : true, summary: summary() });
                snackbar(t("linkUpdated"));
              } catch (error) {
                linkFailure(error);
              }
            });
          case "unlink":
            dialog.innerHTML = `<h2>${escape(t("unlink"))}</h2><p>${escape(t("unlinkConfirm"))}</p>
              <div class="dialog__actions"><button class="button button--text" type="button" data-close>${escape(t("cancel"))}</button>
              <button class="button button--filled" type="button" data-action="unlink-confirm">${escape(t("unlink"))}</button></div>`;
            return dialog.showModal();
          case "unlink-confirm":
            dialog.close();
            return run(async () => {
              try {
                link = await call("unlinkPlayer", { key });
                snackbar(t("linkUpdated"));
              } catch (error) {
                linkFailure(error);
              }
            });
          case "copy-id":
            return navigator.clipboard.writeText(detail.account.profileId).then(() => snackbar(t("copied")));
          case "team":
            return run(async () => {
              const { server } = await call("sendBox", { key });
              openSite(`/{locale}/team-builder/?server=${server}`);
            });
          case "songs":
            return run(async () => {
              const { server } = await call("sendSongProgress", { key });
              openSite(`/{locale}/song-progress/?server=${server ?? "intl"}`);
            });
          case "history":
            return run(async () => {
              await call("readGachaHistory", { key });
              openSite(`/{locale}/gacha-history/`);
            });
          case "sync":
            return run(async () => {
              await call("refreshGameAccount", { key });
              detail = await call("saveDetail", { key });
              snackbar(t("syncedFromGame"));
            });
          case "copy-package":
            return run(async () => {
              await navigator.clipboard.writeText(await call("teamPackage", { key }));
              snackbar(t("copied"));
            });
          case "export":
            return run(async () => {
              if (await call("exportGameAccount", { key })) snackbar(t("saved"));
            });
          case "remove":
            dialog.innerHTML = `<h2>${escape(t("removeAccount"))}</h2><p>${escape(t("removeAccountConfirm", { name: detail.account.name || detail.account.profileId }))}</p>
              <div class="dialog__actions"><button class="button button--text" type="button" data-close>${escape(t("cancel"))}</button>
              <button class="button button--filled" type="button" data-action="remove-confirm">${escape(t("remove"))}</button></div>`;
            return dialog.showModal();
          case "remove-confirm":
            dialog.close();
            return run(async () => {
              await call("deleteGameAccount", { key });
              location.replace("saves.html");
            });
        }
      });

      document.addEventListener("change", (event) => {
        const input = event.target.closest('input[data-action="visibility"]');
        if (!input) return;
        run(async () => {
          try {
            link = await call("linkPlayer", { key, public: input.checked, summary: summary() });
            snackbar(t("linkUpdated"));
          } catch (error) {
            linkFailure(error);
          }
        });
      });
      document.addEventListener(
        "toggle",
        (event) => {
          const fold = event.target.closest?.("[data-fold]");
          if (fold) fold.open ? folds.add(fold.dataset.fold) : folds.delete(fold.dataset.fold);
        },
        true,
      );

      render();
      loadLink();
      loadCatalog()
        .then((loaded) => {
          catalog = loaded;
          render();
        })
        .catch(() => {});
    </script>
  </body>
</html>
