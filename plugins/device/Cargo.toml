[package]
name = "tauri-plugin-haneoka-device"
description = "The phone's own access to the game's folder, system bars and orientation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
links = "tauri-plugin-haneoka-device"

[dependencies]
tauri = "2.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
