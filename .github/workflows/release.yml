name: Release

on:
  push:
    tags: ["v*"]
    branches: [tauri]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options: [all, android, linux, windows, macos, ios]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      android: ${{ steps.version.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Above every code the Flutter releases used (10000 + run number),
          # the same for every APK so any of them updates any other.
          echo "android=$((20000 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"

  desktop:
    needs: version
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux' || inputs.platform == 'windows' || inputs.platform == 'macos'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
            platform: linux
            adb: linux
            arch: x64
            updater: linux-x86_64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            adb: linux
            arch: arm64
            updater: linux-aarch64
          - name: windows-x64
            runner: windows-latest
            platform: windows
            adb: windows
            arch: x64
            updater: windows-x86_64
          - name: macos-arm64
            runner: macos-latest
            platform: macos
            adb: darwin
            arch: arm64
            target: aarch64-apple-darwin
            updater: darwin-aarch64
          - name: macos-x64
            runner: macos-latest
            platform: macos
            adb: darwin
            arch: x64
            target: x86_64-apple-darwin
            updater: darwin-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm xdg-utils
      - name: Bundle ADB
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == linux && "${{ matrix.arch }}" == arm64 ]]; then sudo apt-get install -y adb; fi
          python3 scripts/bundle_adb.py --platform ${{ matrix.adb }} --arch ${{ matrix.arch }} --dest src-tauri/tools/adb
          python3 - <<'PYTHON'
          import json, pathlib
          path = pathlib.Path('src-tauri/tauri.conf.json')
          config = json.loads(path.read_text())
          config['bundle']['resources'] = {'tools/adb/': 'tools/adb/'}
          path.write_text(json.dumps(config, indent=2))
          PYTHON
      - run: npm ci
      - name: Build
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          args=(--config "{\"version\":\"${{ needs.version.outputs.version }}\"}")
          if [[ -n "${{ matrix.target }}" ]]; then args+=(--target "${{ matrix.target }}"); fi
          npx tauri build "${args[@]}"
      - name: Collect
        shell: bash
        run: |
          mkdir dist
          bundle=target/release/bundle
          [[ -n "${{ matrix.target }}" ]] && bundle=target/${{ matrix.target }}/release/bundle
          name=haneoka-${{ matrix.name }}
          shopt -s nullglob
          copy() { cp "$1" "dist/$2"; [[ -f "$1.sig" ]] && cp "$1.sig" "dist/$2.sig"; true; }
          for file in $bundle/deb/*.deb; do copy "$file" "$name.deb"; done
          for file in $bundle/rpm/*.rpm; do copy "$file" "$name.rpm"; done
          for file in $bundle/appimage/*.AppImage; do copy "$file" "$name.AppImage"; done
          for file in $bundle/msi/*.msi; do copy "$file" "$name.msi"; done
          for file in $bundle/nsis/*.exe; do copy "$file" "$name-setup.exe"; done
          for file in $bundle/dmg/*.dmg; do copy "$file" "$name.dmg"; done
          for file in $bundle/macos/*.app.tar.gz; do copy "$file" "$name.app.tar.gz"; done
          if [[ -d $bundle/macos/haneoka.app ]]; then
            (cd $bundle/macos && ditto -c -k --keepParent haneoka.app "$GITHUB_WORKSPACE/dist/$name.zip")
          fi
          # Which package the updater installs on this platform.
          case "${{ matrix.platform }}" in
            windows) echo '{"${{ matrix.updater }}": "'$name'-setup.exe", "${{ matrix.updater }}-nsis": "'$name'-setup.exe", "${{ matrix.updater }}-msi": "'$name'.msi"}' ;;
            macos) echo '{"${{ matrix.updater }}": "'$name'.app.tar.gz"}' ;;
            linux) echo '{"${{ matrix.updater }}": "'$name'.AppImage"}' ;;
          esac > "dist/updater-${{ matrix.name }}.json"
          ls -la dist
          ls dist/*.sig > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  android:
    needs: version
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "build-tools;35.0.0" "platforms;android-36" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tauri android init --ci
      - name: Build
        run: |
          config='{"version":"${{ needs.version.outputs.version }}","bundle":{"android":{"versionCode":${{ needs.version.outputs.android }}}}}'
          npx tauri android build --ci --apk --target aarch64 --config "$config"
          mkdir -p "$RUNNER_TEMP/arm64"
          cp "$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)" "$RUNNER_TEMP/arm64/haneoka.apk"
          npx tauri android build --ci --apk --aab --target aarch64 x86_64 --config "$config"
      - name: Sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          tools=$ANDROID_HOME/build-tools/35.0.0
          mkdir dist
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          aab=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -1)
          if [[ -z "$KEYSTORE" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "::error::A release signing key is required for update-compatible Android releases."; exit 1; fi
            keytool -genkeypair -keystore "$RUNNER_TEMP/debug.jks" -storepass android -keypass android -alias debug -keyalg RSA -dname CN=debug -validity 30
            KEYSTORE_FILE=$RUNNER_TEMP/debug.jks; STORE_PASSWORD=android; KEY_ALIAS=debug; KEY_PASSWORD=android
          else
            KEYSTORE_FILE=$RUNNER_TEMP/release.jks
            echo "$KEYSTORE" | base64 -d > "$KEYSTORE_FILE"
          fi
          sign() {
            "$tools/zipalign" -f -p 4 "$1" "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" sign --ks "$KEYSTORE_FILE" --ks-pass "pass:$STORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" \
              --out "$2" "$RUNNER_TEMP/aligned.apk"
          }
          sign "$apk" dist/haneoka-android.apk
          sign "$RUNNER_TEMP/arm64/haneoka.apk" dist/haneoka-android-arm64-v8a.apk
          cp "$aab" dist/haneoka-android.aab
          jarsigner -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" dist/haneoka-android.aab "$KEY_ALIAS"
          "$tools/apksigner" verify --print-certs dist/haneoka-android.apk | head -3
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  ios:
    needs: version
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          key: ios
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: brew install xcodegen ldid
      - name: Unsigned project
        env:
          # A placeholder team: the archive is built without signing, and the
          # sideloading tool or TrollStore signs it on the reader's side.
          APPLE_DEVELOPMENT_TEAM: "0000000000"
        run: |
          npx tauri ios init --ci
          python3 - <<'PYTHON'
          import pathlib, re
          path = pathlib.Path('src-tauri/gen/apple/project.yml')
          text = path.read_text()
          text = re.sub(r'(settingGroups:\n  app:\n    base:\n)', r'\1      CODE_SIGNING_ALLOWED: NO\n      CODE_SIGNING_REQUIRED: NO\n      CODE_SIGN_IDENTITY: ""\n', text, count=1)
          assert 'CODE_SIGNING_ALLOWED' in text
          path.write_text(text)
          PYTHON
          (cd src-tauri/gen/apple && xcodegen generate)
      - name: Build without signing
        env:
          APPLE_DEVELOPMENT_TEAM: "0000000000"
        run: |
          # The archive needs no signature; only the App Store export does, and that step is expected to fail.
          npx tauri ios build --ci --config '{"version":"${{ needs.version.outputs.version }}"}' || true
          archive=$(find src-tauri/gen/apple/build -maxdepth 2 -name '*.xcarchive' | head -1)
          test -n "$archive" && echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Packages
        run: |
          mkdir -p dist build/ios/standard/Payload build/ios/trollstore/Payload
          app=$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' | head -1)
          ditto "$app" "build/ios/standard/Payload/$(basename "$app")"
          codesign --force --sign - --timestamp=none "build/ios/standard/Payload/$(basename "$app")"
          ditto "build/ios/standard/Payload/$(basename "$app")" "build/ios/trollstore/Payload/$(basename "$app")"
          (cd build/ios/standard && zip -qry "$GITHUB_WORKSPACE/dist/haneoka-ios-unsigned.ipa" Payload)
          binary=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "build/ios/trollstore/Payload/$(basename "$app")/Info.plist")
          ldid -Spackaging/ios-trollstore.entitlements "build/ios/trollstore/Payload/$(basename "$app")/$binary"
          (cd build/ios/trollstore && zip -qry "$GITHUB_WORKSPACE/dist/haneoka-ios-trollstore.tipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release metadata
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.android }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PYTHON'
          import datetime, json, os, pathlib
          dist = pathlib.Path('dist')
          version, tag, repository = os.environ['VERSION'], os.environ['TAG'], os.environ['REPOSITORY']
          (dist / 'release-version.json').write_text(json.dumps({'version': version, 'buildNumber': int(os.environ['BUILD'])}) + '\n')
          platforms = {}
          for part in sorted(dist.glob('updater-*.json')):
              for platform, name in json.loads(part.read_text()).items():
                  platforms[platform] = {
                      'signature': (dist / f'{name}.sig').read_text().strip(),
                      'url': f'https://github.com/{repository}/releases/download/{tag}/{name}',
                  }
              part.unlink()
          for signature in dist.glob('*.sig'):
              signature.unlink()
          (dist / 'updater.json').write_text(json.dumps({
              'version': version,
              'pub_date': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': platforms,
          }, indent=2) + '\n')
          PYTHON
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
